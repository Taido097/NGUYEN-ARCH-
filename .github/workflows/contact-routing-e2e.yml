name: Contact routing end-to-end test

on:
  push:
    branches:
      - codex/test-all-nguyen-forms
    paths:
      - .github/workflows/contact-routing-e2e.yml

jobs:
  test-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Submit consultation inquiry
        shell: bash
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            -X POST https://nguyenarchitecture.com/api/contact \
            -H 'Content-Type: application/json' \
            --data '{"inquiryType":"consultation","name":"Codex E2E Consultation '"$GITHUB_RUN_ID"'","email":"taido097@gmail.com","phone":"7147078889","projectType":"Custom Home","budget":"2,500 - 10,000 sq ft","message":"Automated end-to-end test of the customer consultation email route.","company":"","website":""}')
          echo "$response"
          echo "$response" | jq -e '.success == true'

      - name: Submit collaboration inquiry
        shell: bash
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            -X POST https://nguyenarchitecture.com/api/contact \
            -H 'Content-Type: application/json' \
            --data '{"inquiryType":"collaboration","name":"Codex E2E Collaboration '"$GITHUB_RUN_ID"'","email":"taido097@gmail.com","phone":"7147078889","projectType":"Commercial","budget":"10,000 - 50,000 sq ft","message":"Automated end-to-end test of the contractor collaboration email route.","company":"Codex Test Contractor","website":""}')
          echo "$response"
          echo "$response" | jq -e '.success == true'
